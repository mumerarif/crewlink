name: crewlink-test

services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: crewlink_test
      POSTGRES_USER: crewlink_test
      POSTGRES_PASSWORD: crewlink_test_password
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crewlink_test -d crewlink_test"]
      interval: 2s
      timeout: 3s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data
