services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crewlink}
      POSTGRES_USER: ${POSTGRES_USER:-crewlink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crewlink_dev_password}
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - crewlink

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data
    networks:
      - crewlink

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["npm", "run", "prisma:deploy", "--workspace", "@crewlink/api"]
    environment: &api-environment
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL:-postgresql://crewlink:crewlink_dev_password@postgres:5432/crewlink?schema=public}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      AI_DRAFT_MODE: ${AI_DRAFT_MODE:-mock}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      OPENROUTER_TIMEOUT_MS: ${OPENROUTER_TIMEOUT_MS:-15000}
      OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-5000}
      OUTBOX_STALE_MS: ${OUTBOX_STALE_MS:-30000}
      NOTIFICATION_MAX_ATTEMPTS: ${NOTIFICATION_MAX_ATTEMPTS:-5}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - crewlink

  seed:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["npm", "run", "prisma:seed", "--workspace", "@crewlink/api"]
    environment:
      <<: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - crewlink

  api1:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      <<: *api-environment
      INSTANCE_ID: api-1
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3001/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - crewlink

  api2:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      <<: *api-environment
      INSTANCE_ID: api-2
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3001/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - crewlink

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["npm", "run", "worker", "--workspace", "@crewlink/api"]
    environment:
      <<: *api-environment
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - crewlink

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    networks:
      - crewlink

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NODE_ENV: production
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://nginx}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    ports:
      - "3000:3000"
    depends_on:
      nginx:
        condition: service_started
    networks:
      - crewlink

volumes:
  postgres_data:
  redis_data:

networks:
  crewlink:
    driver: bridge
